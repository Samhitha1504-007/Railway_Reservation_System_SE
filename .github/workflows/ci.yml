name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR replaces a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SRC: RRS/04_IMPLEMENTATION_TESTING/source-code
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libncurses-dev libssl-dev libgtest-dev cppcheck

      - name: Configure
        run: cmake -S "$SRC" -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --output-junit test-results.xml --no-tests=error

      - name: Static analysis
        run: cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --quiet -I "$SRC/include" "$SRC/src"

      # Evidence for RRS/04_IMPLEMENTATION_TESTING/CI-CD-evidence
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results.xml
          if-no-files-found: ignore
